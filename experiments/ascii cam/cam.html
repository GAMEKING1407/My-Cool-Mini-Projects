<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Color Webcam ASCII Mirror</title>

  <link rel="stylesheet" href="cam.css">
</head>
<body>
  <div class="controls">
    <label for="colorMode">Color Mode:</label>
    <select id="colorMode">
      <option value="truecolor">True Webcam Color</option>
      <option value="rainbow">Animated Rainbow Wave</option>
      <option value="matrix">Classic Matrix Green</option>
      <option value="cyberpunk">Cyberpunk Neon (Pink/Cyan)</option>
    </select>
  </div>

  <canvas id="asciiCanvas"></canvas>

  <script src="cam.js"></script>
</body>
</html>
